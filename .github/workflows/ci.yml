name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit high and critical advisories
        run: npm audit --audit-level=high

      - name: Run TypeScript type check
        run: npm run lint

      - name: Run detector unit tests
        run: npm run test:detector

      - name: Validate real-telemetry corpus contract example
        run: npm run validate:telemetry-corpus

      - name: Build application
        run: npm run build

      - name: Generate synthetic benchmark evidence
        if: matrix.node-version == '22.x'
        run: npm run benchmark:detector
        env:
          BENCHMARK_IMPLEMENTATION_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Upload synthetic benchmark evidence
        if: matrix.node-version == '22.x'
        uses: actions/upload-artifact@v4
        with:
          name: detector-benchmark-v1
          path: artifacts/benchmark-result.json
          if-no-files-found: error

  evidence-boundary:
    name: Evidence Boundary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify current-facing governance and contribution boundaries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          required = {
              Path('README.md'): (
                  'Epistemic status:',
                  'Cross-repository lineage or integration does not transfer validation.',
              ),
              Path('GOVERNANCE.md'): (
                  '## Current authority',
                  'historical provenance only',
                  'Orbit-Driftwatch',
              ),
              Path('CONTRIBUTING.md'): (
                  '## Authority and evidence boundary',
                  'Dynamic Governance Agentic Formation',
                  'Cross-repository references do not transfer validation.',
              ),
          }
          for path, markers in required.items():
              text = path.read_text(encoding='utf-8')
              for marker in markers:
                  if marker not in text:
                      raise SystemExit(f'missing evidence-boundary marker {marker!r} in {path}')

          banned = (
              'Governing agent:',
              'meta-orchestrated by **Agent Amethyst**',
              'Dynamic Governance Assurance Framework',
              'Fibonacci Phi-Closure Gate (BLOCKING)',
              'NDR-133 Personal Document Firewall (BLOCKING-ABSOLUTE)',
          )
          for path in (Path('GOVERNANCE.md'), Path('CONTRIBUTING.md')):
              text = path.read_text(encoding='utf-8')
              for token in banned:
                  if token in text:
                      raise SystemExit(f'stale current-facing claim {token!r} in {path}')

          print('DRIFTWATCH_EVIDENCE_BOUNDARY_PASS')
          PY
