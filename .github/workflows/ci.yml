name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit high and critical advisories
        run: npm audit --audit-level=high

      - name: Run TypeScript type check
        run: npm run lint

      - name: Run detector unit tests
        run: npm run test:detector

      - name: Build application
        run: npm run build

      - name: Generate synthetic benchmark evidence
        if: matrix.node-version == '22.x'
        run: npm run benchmark:detector
        env:
          BENCHMARK_IMPLEMENTATION_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Upload synthetic benchmark evidence
        if: matrix.node-version == '22.x'
        uses: actions/upload-artifact@v4
        with:
          name: detector-benchmark-v1
          path: artifacts/benchmark-result.json
          if-no-files-found: error
